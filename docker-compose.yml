services:
  postgres:
    image: postgres:15
    container_name: bridge_postgres
    environment:
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_pass
    ports:
      - "5433:5432"
    volumes:
      - bridge_postgres_data:/var/lib/postgresql/data

volumes:
  bridge_postgres_data:
